name: Aplicar hover de colores por carrera

on:
  push:
    paths:
      - '.github/workflows/aplicar-hover-colores.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar estilos hover
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Marca las fichas de carrera para que los efectos internos usen su --accent.
          old_main = '<main class="max-w-7xl mx-auto px-4 py-7 md:py-10" style="--accent:${c.color}">'
          new_main = '<main class="career-page max-w-7xl mx-auto px-4 py-7 md:py-10" style="--accent:${c.color}">'
          if old_main in s:
              s = s.replace(old_main, new_main, 1)

          css = r'''
          /* Hover dinámico por color de carrera */
          @media (hover:hover) {
            .card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease}
            .card:hover{
              transform:translateY(-6px);
              background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 62%,#0b1220),color-mix(in srgb,var(--accent) 42%,#0b1220));
              border-color:color-mix(in srgb,var(--accent) 72%,white);
              box-shadow:0 28px 70px color-mix(in srgb,var(--accent) 30%,rgba(0,0,0,.45));
            }
            .card:hover .text-slate-400{color:#f1f5f9}
            .card:hover .soft{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}

            .career-page .glass,.career-page .soft{transition:background .28s ease,border-color .28s ease,box-shadow .28s ease,transform .28s ease}
            .career-page .glass:not(.sticky-nav):hover{
              background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 48%,#0b1220),color-mix(in srgb,var(--accent) 30%,#0b1220));
              border-color:color-mix(in srgb,var(--accent) 62%,white);
              box-shadow:0 24px 65px color-mix(in srgb,var(--accent) 22%,rgba(0,0,0,.45));
              transform:translateY(-2px);
            }
            .career-page .soft:hover{
              background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 58%,#0b1220),color-mix(in srgb,var(--accent) 38%,#0b1220));
              border-color:color-mix(in srgb,var(--accent) 68%,white);
              box-shadow:0 14px 32px color-mix(in srgb,var(--accent) 20%,rgba(0,0,0,.35));
              transform:translateY(-2px);
            }
            .career-page .glass:hover .text-slate-400,.career-page .soft:hover .text-slate-400{color:#e2e8f0}
            .career-page .glass:hover .eyebrow,.career-page .soft:hover .eyebrow{color:#fff}
            .career-page .navchip{transition:background .22s ease,color .22s ease}
            .career-page .navchip:hover{background:color-mix(in srgb,var(--accent) 55%,#0b1220);color:#fff}
            .career-page .plan-card:before{transition:width .25s ease}
            .career-page .plan-card:hover:before{width:7px}
          }
          '''

          marker = '/* Hover dinámico por color de carrera */'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          path.write_text(s, encoding='utf-8')

      - name: Commit y push
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar hover con color propio en todas las tarjetas"
          git push
