  <button onclick="location.hash=''" class="mb-6 text-blue-200 hover:text-white">← Volver a carreras</button>
  <section class="glass rounded-3xl p-7 md:p-10 mb-8" style="background:linear-gradient(135deg,${c.color}33,rgba(15,23,42,.82))">
   <div class="flex flex-wrap gap-2 mb-4"><span class="px-3 py-1 rounded-full text-xs font-black" style="background:${c.color}33;color:${c.color}">${c.area}</span><span class="pill px-3 py-1 rounded-full text-xs">Inicio: Marzo · Abril 2027</span></div>
   <h1 class="text-4xl md:text-5xl font-black">${c.nombre}</h1>
   <p class="text-lg text-slate-200 mt-4 max-w-4xl">${c.presentacion}</p>
   <div class="grid sm:grid-cols-3 gap-3 mt-7"><div class="pill rounded-2xl p-4"><div class="text-xs text-slate-400">DURACIÓN</div><b>${c.duracion}</b></div><div class="pill rounded-2xl p-4"><div class="text-xs text-slate-400">MODALIDAD</div><b>${c.modalidad}</b></div><div class="pill rounded-2xl p-4"><div class="text-xs text-slate-400">TÍTULO OFICIAL</div><b>${c.titulo}</b></div></div>
   ${c.certificaciones.length?`<div class="mt-4 pill rounded-2xl p-4"><div class="text-xs text-slate-400 mb-2">CERTIFICACIONES / ARTICULACIÓN</div>${list(c.certificaciones,'★')}</div>`:''}
  </section>
  <section class="grid md:grid-cols-2 gap-6 mb-8">
   ${c.aprender?`<article class="glass rounded-3xl p-6"><h2 class="text-2xl font-black mb-4">📦 ¿Qué voy a aprender?</h2><p class="text-slate-200 leading-relaxed">${c.aprender}</p></article>`:''}
   ${c.donde&&c.donde.length?`<article class="glass rounded-3xl p-6"><h2 class="text-2xl font-black mb-4">💼 ¿Dónde podrás trabajar?</h2>${list(c.donde)}</article>`:''}
   <article class="glass rounded-3xl p-6"><h2 class="text-2xl font-black mb-4">🧠 ¿Qué ${c.aprender?'podré':'sabrás'} hacer?</h2>${list(c.hacer)}</article>
  </section>
  ${c.continuidad.length?`<section class="glass rounded-3xl p-6 mb-8"><h2 class="text-2xl font-black mb-4">🎓 Continuidad universitaria</h2><div class="grid md:grid-cols-2 gap-3">${c.continuidad.map(x=>`<div class="pill rounded-xl p-4">${x}</div>`).join('')}</div></section>`:''}
  <section class="glass rounded-3xl p-6 mb-8"><h2 class="text-2xl font-black mb-5">📚 Plan de estudios completo</h2><div class="grid md:grid-cols-2 gap-4">${c.plan.map(([sem,mats])=>`<div class="pill rounded-2xl p-5"><h3 class="font-black mb-3" style="color:${c.color}">${sem}</h3>${list(mats,'•')}</div>`).join('')}</div></section>
  <section class="glass rounded-3xl p-6 mb-8"><h2 class="text-2xl font-black mb-4">📄 ${requisitosCustom?'¿Qué necesito para cursar?':'Requisitos de ingreso'}</h2>${requisitosCustom?'':`<p class="text-slate-300 mb-4">La web oficial informa que, luego del inicio de clases, el estudiante dispone de hasta 10 días para subir la documentación en Autogestión Alumno.</p>`}${list(requisitos,'✓')}${requisitosCustom?'':`<p class="text-sm text-slate-400 mt-4">La documentación y condiciones pueden actualizarse. Conviene verificar siempre la landing oficial antes de confirmar un caso particular.</p>`}</section>
  <div class="flex flex-col sm:flex-row gap-3 pb-12">${c.url?`<a href="${c.url}" target="_blank" rel="noopener" class="flex-1 text-center rounded-2xl px-5 py-4 font-black" style="background:${c.color}">🌐 Ver landing oficial de ${c.nombre}</a>`:''}<button onclick="copyInfo('${c.slug}')" class="flex-1 pill rounded-2xl px-5 py-4 font-black">📋 Copiar resumen comercial</button></div>
 </main>`
}
function copyInfo(slug){const c=carreras.find(x=>x.slug===slug);const cert=c.certificaciones.length?`\n📜 ${c.certificaciones.join(' · ')}`:'';const detalle=c.donde&&c.donde.length?`\n\n💼 Salida laboral:\n• ${c.donde.slice(0,4).join('\n• ')}`:`\n\n🧠 Podrás:\n• ${c.hacer.slice(0,4).join('\n• ')}`;const txt=`🎓 ${c.nombre}\nTítulo: ${c.titulo}\n⏳ Duración: ${c.duracion}\n💻 Modalidad: ${c.modalidad}${cert}${detalle}\n\n📅 Próximos inicios informados: Marzo - Abril 2027`;navigator.clipboard.writeText(txt).then(()=>alert('Resumen copiado ✅'))}
function render(){const slug=location.hash.replace('#','');const c=carreras.find(x=>x.slug===slug);document.getElementById('app').innerHTML=c?career(c):home();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
