const QUIZ_EXTRA={'analista-de-sistemas':[['¿Qué certificaciones obtiene el estudiante antes del título final?','Técnico Informático al finalizar 1º año y Analista Programador al finalizar 2º año.'],['Nombrá cuatro áreas del plan que demuestren que no es solo programación.','Por ejemplo: sistemas, bases de datos, redes y comunicaciones, arquitectura, sistemas operativos o administración de proyectos.'],['Un interesado dice “quiero tecnología, pero no solamente hacer páginas web”. ¿Qué aspecto de esta carrera remarcarías?','La mirada integral sobre sistemas de información: análisis de necesidades, diseño de soluciones, programación, bases de datos, redes e infraestructura.']],'desarrollo-web':[['¿Qué materias muestran que también se trabaja calidad y seguridad?','Ciberseguridad y Testeador de Software, además de proyectos integradores.'],['¿Qué tres entornos laborales podrías mencionar?','Empresas de desarrollo, proveedoras de software, consultoras, empresas de infraestructura tecnológica o proyectos independientes.'],['Un interesado compara la carrera con un curso de pocas semanas. ¿Qué diferencia concreta explicarías?','Que la tecnicatura otorga título oficial y desarrolla una formación integral con programación, bases de datos, proyectos, ciberseguridad, testing y práctica profesionalizante.']],'ciencia-de-datos-ia':[['¿Qué tipos de información puede analizar el egresado?','Imágenes, web, texto y datos estructurados, además de grandes volúmenes de datos.'],['Nombrá tres materias avanzadas específicas de datos o IA.','Aprendizaje Automático, Desarrollo de Sistemas de IA, Minería de Datos, Procesamiento de Imágenes o Técnicas de Procesamiento de Habla.'],['¿Cómo explicarías la carrera a alguien que pregunta “para qué sirven los datos”?','Para transformar datos en información útil, encontrar patrones, apoyar decisiones y desarrollar modelos predictivos o soluciones de IA.']],'recursos-humanos':[['Además de selección, nombrá cuatro procesos que aborda la carrera.','Capacitación, administración de personal, relaciones laborales, sueldos, compensaciones, desempeño o clima.'],['¿Cuál es la certificación intermedia informada?','Analista de Recursos Humanos al finalizar 2º año.'],['Un interesado dice “me gusta trabajar con personas, pero quiero una formación de gestión”. ¿Qué le responderías?','Que RRHH combina el trabajo con personas con administración, legislación, procesos, desempeño, compensaciones y desarrollo organizacional.']],'marketing':[['Nombrá cuatro competencias de Marketing que no sean “publicar en redes”.','Investigación de mercado, ventas, neuromarketing, e-commerce, negociación, distribución, control de gestión o formulación de planes de marketing.'],['¿Cuál es la certificación intermedia informada?','Analista en Gestión de Marketing al finalizar 2º año.'],['¿Cómo responderías a “Marketing es lo mismo que Community Manager”?','Explicaría que la carrera aborda estrategia comercial y de mercado, investigación, ventas, e-commerce, marca y planificación, además de herramientas digitales.']],'administracion-de-empresas':[['¿Qué áreas de una empresa aparecen en la formación?','Administración, contabilidad, economía, finanzas, personas, producción, comercialización y control de gestión, entre otras.'],['¿Cuál es la certificación intermedia informada?','Analista en Gestión Administrativa al finalizar 2º año.'],['Un interesado tiene un negocio familiar. ¿Qué contenidos relacionarías con su caso?','Gestión integral, contabilidad, finanzas, administración de personas, comercialización, producción, control de gestión y profesionalización de Pymes.']],'higiene-y-seguridad':[['Nombrá cuatro factores o condiciones que un técnico puede analizar.','Por ejemplo: incendio, señalización, ventilación, ruido, iluminación, carga térmica o ergonomía.'],['¿Cuántas prácticas profesionalizantes aparecen en el plan?','Tres: Práctica Profesionalizante I, II y III.'],['Un interesado piensa que solo podrá trabajar en industria. ¿Qué otros ámbitos mencionarías?','Organizaciones públicas, organismos gubernamentales, ART, seguros, entidades gremiales, organizaciones ambientales o establecimientos educativos.']],'gestion-inmobiliaria':[['Nombrá cuatro tareas concretas del perfil profesional.','Operaciones de alquiler/compra/venta, tasaciones, administración de propiedades, cobranzas, marketing, fideicomisos o asistencia en desarrollos inmobiliarios.'],['¿Qué materias específicas de tasación aparecen?','Cotización y Tasación I y Cotización y Tasación II.'],['¿Qué continuidad o articulación destacarías ante alguien que quiere seguir creciendo en el rubro?','Las alternativas vinculadas con Martillero y Corredor Público, Emprendimientos y Corretaje Inmobiliario que figuran en la ficha.']],'logistica':[['Nombrá cinco procesos que puede gestionar un Técnico Superior en Logística.','Recepción, almacenamiento, despacho, distribución y transporte; también relaciones con proveedores, empresas, clientes y consumidores.'],['¿Qué contenidos del plan conectan Logística con tecnología?','Herramientas Tecnológicas, Transformación digital y Logística, Sistemas de Información Logística, e-commerce e Industrias 4.0.'],['Un interesado pregunta si solo verá transporte. ¿Cómo responderías?','Que transporte es una parte: también se trabaja abastecimiento, operaciones, costos, procesos productivos, calidad, comercio internacional, digitalización, e-commerce y optimización.']]};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function list(items,icon='✓'){return `<ul class="space-y-2.5">${items.map(x=>`<li class="flex gap-3"><span class="mt-0.5 text-emerald-400">${icon}</span><span class="text-slate-200">${esc(x)}</span></li>`).join('')}</ul>`}function totalMaterias(c){return c.plan.reduce((n,[,m])=>n+m.length,0)}
function faqFor(c){const cert=c.certificaciones.length?c.certificaciones.join(' · '):'No se informa una certificación intermedia en esta ficha.';return [[`¿Cuánto dura ${c.nombre}?`,c.duracion],['¿Qué título se obtiene?',c.titulo],['¿Qué modalidad tiene?',c.modalidad],['¿Hay certificaciones intermedias o articulaciones?',cert],...(FAQ_EXTRA[c.slug]||[])];}
function quizFor(c){const salida=(c.donde&&c.donde.length)?`Podés mencionar, por ejemplo: ${c.donde.slice(0,3).join('; ')}.`:`La ficha no enumera ámbitos laborales específicos. Conviene orientar la respuesta a sus funciones: ${c.hacer.slice(0,3).join('; ')}.`;const cert=c.certificaciones.length?c.certificaciones.join(' · '):'No hay una certificación intermedia informada en esta ficha.';return [['¿Cuál es el título oficial de la carrera?',c.titulo],['¿Cuánto dura y cuál es su modalidad?',`${c.duracion}. Modalidad: ${c.modalidad}.`],['Mencioná al menos tres cosas que puede hacer el egresado.',c.hacer.slice(0,3).join('; ')+'.'],['Mencioná tres ámbitos laborales o aplicaciones profesionales.',salida],['¿Tiene certificación intermedia o articulación informada?',cert],...(QUIZ_EXTRA[c.slug]||[])];}
function discoveryCard(c){const d=DISCOVERY[c.slug];if(!d)return '';const pasos=[['1','Abrir sin vender','Preguntá qué le llamó la atención de la carrera y dejá que explique con sus palabras.'],['2','Explorar conocimientos','Detectá qué sabe, qué experiencias tuvo y qué conceptos ya conoce del área.'],['3','Entender el objetivo','Indagá qué quiere lograr: trabajar, cambiar de rubro, crecer, emprender o continuar estudios.'],['4','Detectar dudas y barreras','Preguntá por miedos, materias, modalidad, tiempos, expectativas y cualquier freno que aparezca.'],['5','Devolver y conectar','Resumí lo que escuchaste y vinculá solo 2 o 3 aspectos de la carrera con lo que la persona dijo.']];return `<section id="indagacion" class="glass rounded-[28px] p-6 md:p-8 mb-7" style="--accent:${c.color}"><div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6"><div><div class="section-title"><span class="ico">🔎</span><span>Guía de indagación</span></div><p class="text-slate-400 mt-2 max-w-3xl">Preguntas y pasos para conocer mejor a la persona antes de recomendar o argumentar la carrera.</p></div><button onclick="copyDiscovery('${c.slug}')" class="quiz-btn soft rounded-2xl px-4 py-3 font-bold">📋 Copiar preguntas</button></div><div class="soft rounded-2xl p-5 mb-5 border-l-4" style="border-left-color:${c.color}"><div class="eyebrow mb-2">Qué buscamos descubrir</div><p class="text-slate-200 leading-relaxed">${esc(d.objetivo)}</p></div><div class="grid xl:grid-cols-[.9fr_1.1fr] gap-5"><div><h3 class="font-black text-lg mb-3">Pasos sugeridos</h3><div class="space-y-3">${pasos.map(([n,t,x])=>`<div class="soft rounded-2xl p-4 flex gap-3"><span class="w-9 h-9 shrink-0 rounded-xl grid place-items-center font-black text-white" style="background:${c.color}">${n}</span><div><div class="font-black">${t}</div><div class="text-slate-400 text-sm mt-1 leading-relaxed">${x}</div></div></div>`).join('')}</div></div><div><h3 class="font-black text-lg mb-3">Preguntas para indagar</h3><div class="space-y-3">${d.preguntas.map((q,i)=>`<div class="soft rounded-2xl p-4 flex gap-3"><span class="w-8 h-8 shrink-0 rounded-xl grid place-items-center font-black text-white" style="background:${c.color}">${i+1}</span><p class="text-slate-200 leading-relaxed">${esc(q)}</p></div>`).join('')}</div></div></div><div class="mt-5"><h3 class="font-black text-lg mb-3">Qué escuchar en las respuestas</h3><div class="flex flex-wrap gap-2">${d.escuchar.map(x=>`<span class="soft rounded-full px-3 py-2 text-sm text-slate-200">👂 ${esc(x)}</span>`).join('')}</div></div></section>`;}
function comercialCard(c){const x=COMERCIAL[c.slug];if(!x)return '';return `<section id="claves" class="glass rounded-[28px] p-6 md:p-8 mb-7" style="--accent:${c.color}"><div class="section-title mb-6"><span class="ico">🎯</span><span>Claves para orientar al interesado</span></div><div class="grid lg:grid-cols-3 gap-4"><div class="soft rounded-2xl p-5"><div class="eyebrow mb-2">Perfil que puede encajar</div><p class="text-slate-200 leading-relaxed">${esc(x.ideal)}</p></div><div class="soft rounded-2xl p-5"><div class="eyebrow mb-2">Cómo explicarla en una frase</div><p class="text-slate-200 leading-relaxed">${esc(x.pitch)}</p></div><div class="soft rounded-2xl p-5"><div class="eyebrow mb-3">Puntos para destacar</div>${list(x.focos,'•')}</div></div></section>`;}
function home(){document.title='Institución Cervantes · Guía Comercial de Carreras';const areas=['TODAS',...new Set(carreras.map(c=>c.area))];return `<main class="max-w-7xl mx-auto px-4 py-10 md:py-14"><section class="glass rounded-[34px] p-7 md:p-12 overflow-hidden relative mb-8"><div class="absolute -right-16 -top-16 w-72 h-72 rounded-full bg-blue-500/10 blur-3xl"></div><div class="relative max-w-4xl"><div class="eyebrow">Herramienta interna de capacitación y venta</div><h1 class="text-4xl md:text-6xl font-black tracking-tight mt-3 gradient-text">Información de carreras, lista para usar.</h1><p class="text-lg text-slate-300 mt-5 max-w-3xl leading-relaxed">Consultá planes de estudio, perfiles, salidas, requisitos, preguntas frecuentes y un preguntero por carrera para capacitar al equipo comercial.</p><div class="flex flex-wrap gap-3 mt-7"><div class="soft rounded-2xl px-4 py-3"><b class="text-2xl">${carreras.length}</b><span class="text-slate-400 ml-2">carreras</span></div><div class="soft rounded-2xl px-4 py-3"><b class="text-2xl">${carreras.reduce((n,c)=>n+totalMaterias(c),0)}</b><span class="text-slate-400 ml-2">materias cargadas</span></div><div class="soft rounded-2xl px-4 py-3"><b class="text-2xl">${carreras.reduce((n,c)=>n+quizFor(c).length,0)}</b><span class="text-slate-400 ml-2">preguntas de capacitación</span></div></div></div></section><section class="mb-7"><div class="grid lg:grid-cols-[1fr_auto] gap-4 items-center"><div class="relative"><span class="absolute left-4 top-1/2 -translate-y-1/2">🔎</span><input id="careerSearch" oninput="filterCareers()" class="search w-full rounded-2xl py-4 pl-12 pr-4 text-white" placeholder="Buscar carrera, área, título o palabra clave…"></div><div class="flex gap-2 overflow-x-auto pb-1">${areas.map((a,i)=>`<button data-area="${esc(a)}" onclick="setArea('${esc(a)}',this)" class="filter-btn ${i===0?'active':''} soft rounded-full px-4 py-3 text-sm font-bold">${esc(a)}</button>`).join('')}</div></div></section><section id="careerGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">${carreras.map(c=>careerTile(c)).join('')}</section><div id="emptyState" class="hidden glass rounded-3xl p-10 text-center mt-6"><div class="text-4xl mb-3">🔎</div><h3 class="text-xl font-black">No encontramos coincidencias</h3><p class="text-slate-400 mt-2">Probá con otro nombre o elegí “Todas”.</p></div></main>`;}
function careerTile(c){const x=COMERCIAL[c.slug];return `<button data-career data-area="${esc(c.area)}" data-search="${esc((c.nombre+' '+c.area+' '+c.titulo+' '+c.presentacion+' '+(x?.focos||[]).join(' ')).toLowerCase())}" onclick="location.hash='${c.slug}'" class="card glass rounded-[26px] p-6 text-left min-h-[280px] flex flex-col relative overflow-hidden" style="--accent:${c.color}"><div class="absolute inset-x-0 top-0 h-1" style="background:${c.color}"></div><div class="flex justify-between gap-3 items-start"><span class="text-xs font-black tracking-wider px-3 py-1.5 rounded-full text-white" style="background:${c.color}">${esc(c.area)}</span><span class="w-9 h-9 rounded-full soft grid place-items-center">↗</span></div><h2 class="text-2xl font-black mt-5 leading-tight">${esc(c.nombre)}</h2><p class="text-slate-400 text-sm mt-3 leading-relaxed line-clamp-4">${esc(c.presentacion)}</p><div class="mt-auto pt-5 flex flex-wrap gap-2"><span class="soft rounded-full px-3 py-1.5 text-xs">⏳ ${esc(c.duracion)}</span><span class="soft rounded-full px-3 py-1.5 text-xs">📚 ${totalMaterias(c)} materias</span><span class="soft rounded-full px-3 py-1.5 text-xs">❓ ${quizFor(c).length} preguntas</span></div></button>`;}
let activeArea='TODAS';function setArea(area,btn){activeArea=area;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');filterCareers()}function filterCareers(){const q=(document.getElementById('careerSearch')?.value||'').trim().toLowerCase();let shown=0;document.querySelectorAll('[data-career]').forEach(card=>{const okArea=activeArea==='TODAS'||card.dataset.area===activeArea;const okQ=!q||card.dataset.search.includes(q);card.style.display=okArea&&okQ?'flex':'none';if(okArea&&okQ)shown++;});document.getElementById('emptyState')?.classList.toggle('hidden',shown!==0);}
function career(c){document.title=`${c.nombre} · Cervantes`;const requisitos=c.requisitos||REQUISITOS,requisitosCustom=Array.isArray(c.requisitos),faqs=faqFor(c),quiz=quizFor(c);return `<main class="career-page max-w-7xl mx-auto px-4 py-7 md:py-10" style="--accent:${c.color}"><button onclick="location.hash=''" class="mb-5 soft rounded-full px-4 py-2.5 hover:bg-white/10">← Volver a carreras</button><section class="glass rounded-[34px] p-7 md:p-11 mb-5 relative overflow-hidden accent-ring"><div class="absolute -right-16 -top-20 w-80 h-80 rounded-full blur-3xl opacity-20" style="background:${c.color}"></div><div class="relative"><div class="flex flex-wrap gap-2 mb-5"><span class="px-3 py-1.5 rounded-full text-xs font-black text-white" style="background:${c.color}">${esc(c.area)}</span><span class="soft px-3 py-1.5 rounded-full text-xs">Inicio: Marzo · Abril 2027</span></div><h1 class="text-4xl md:text-6xl font-black tracking-tight max-w-5xl">${esc(c.nombre)}</h1><p class="text-lg md:text-xl text-slate-300 mt-5 max-w-4xl leading-relaxed">${esc(c.presentacion)}</p>${c.aprender?`<p class="text-slate-300 mt-4 max-w-4xl leading-relaxed"><b class="text-white">Qué vas a aprender:</b> ${esc(c.aprender)}</p>`:''}<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-8"><div class="stat soft rounded-2xl p-4"><div class="eyebrow">Duración</div><div class="text-xl font-black mt-2">${esc(c.duracion)}</div></div><div class="stat soft rounded-2xl p-4"><div class="eyebrow">Modalidad</div><div class="font-bold mt-2">${esc(c.modalidad)}</div></div><div class="stat soft rounded-2xl p-4"><div class="eyebrow">Título oficial</div><div class="font-bold mt-2">${esc(c.titulo)}</div></div><div class="stat soft rounded-2xl p-4"><div class="eyebrow">Plan cargado</div><div class="text-xl font-black mt-2">${totalMaterias(c)} materias</div></div></div>${c.certificaciones.length?`<div class="mt-4 soft rounded-2xl p-4"><div class="eyebrow mb-3">Certificaciones / articulaciones</div>${list(c.certificaciones,'★')}</div>`:''}</div></section><nav class="sticky-nav glass rounded-2xl px-3 py-2 mb-7 overflow-x-auto"><div class="flex gap-2 text-sm font-bold"><button class="navchip rounded-xl px-3 py-2" onclick="goSection('claves')">🎯 Claves</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('indagacion')">🔎 Indagación</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('perfil')">💼 Perfil</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('plan')">📚 Plan</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('faq')">💬 FAQ</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('preguntero')">🧠 Preguntero</button><button class="navchip rounded-xl px-3 py-2" onclick="goSection('requisitos')">📄 Requisitos</button></div></nav>${comercialCard(c)}${discoveryCard(c)}<section id="perfil" class="grid lg:grid-cols-2 gap-5 mb-7">${c.donde&&c.donde.length?`<article class="glass rounded-[28px] p-6 md:p-8"><div class="section-title mb-5"><span class="ico">💼</span><span>¿Dónde podrás trabajar?</span></div>${list(c.donde)}</article>`:''}<article class="glass rounded-[28px] p-6 md:p-8 ${!(c.donde&&c.donde.length)?'lg:col-span-2':''}"><div class="section-title mb-5"><span class="ico">🧩</span><span>¿Qué podrá hacer el egresado?</span></div>${list(c.hacer)}</article></section>${c.continuidad.length?`<section class="glass rounded-[28px] p-6 md:p-8 mb-7"><div class="section-title mb-5"><span class="ico">🎓</span><span>Continuidad universitaria</span></div><div class="grid md:grid-cols-2 gap-3">${c.continuidad.map(x=>`<div class="soft rounded-2xl p-4 text-slate-200">${esc(x)}</div>`).join('')}</div></section>`:''}<section id="plan" class="glass rounded-[28px] p-6 md:p-8 mb-7"><div class="flex flex-wrap items-end justify-between gap-3 mb-6"><div><div class="section-title"><span class="ico">📚</span><span>Plan de estudios</span></div><p class="text-slate-400 mt-2">${totalMaterias(c)} materias organizadas en ${c.plan.length} bloques.</p></div><span class="soft rounded-full px-3 py-2 text-sm">Plan completo cargado</span></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${c.plan.map(([sem,mats])=>`<div class="plan-card soft rounded-2xl p-5" style="--accent:${c.color}"><h3 class="font-black mb-4 pl-2" style="color:#fff">${esc(sem)}</h3><div class="pl-2">${list(mats,'•')}</div></div>`).join('')}</div></section><section id="faq" class="glass rounded-[28px] p-6 md:p-8 mb-7"><div class="section-title mb-2"><span class="ico">💬</span><span>Preguntas frecuentes</span></div><p class="text-slate-400 mb-6">Respuestas rápidas para dudas que pueden aparecer durante una consulta comercial.</p><div class="space-y-3">${faqs.map(([q,a])=>`<details class="soft rounded-2xl p-5"><summary class="flex items-center justify-between gap-4 font-bold"><span>${esc(q)}</span><span class="chev text-slate-400">⌄</span></summary><div class="pt-4 mt-4 border-t border-white/10 text-slate-300 leading-relaxed">${esc(a)}</div></details>`).join('')}</div></section><section id="preguntero" class="glass rounded-[28px] p-6 md:p-8 mb-7"><div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6"><div><div class="section-title"><span class="ico">🧠</span><span>Preguntero para capacitación</span></div><p class="text-slate-400 mt-2">Usalo para preguntar en vivo a las asistentes y revelar la respuesta después.</p></div><button onclick="randomQuestion('${c.slug}')" class="quiz-btn rounded-2xl px-5 py-3 font-black text-white" style="background:${c.color}">🎲 Pregunta aleatoria</button></div><div id="randomBox" class="hidden mb-5 soft rounded-2xl p-5 border-l-4" style="border-left-color:${c.color}"></div><div class="grid lg:grid-cols-2 gap-4">${quiz.map(([q,a],i)=>`<article class="soft rounded-2xl p-5"><div class="flex gap-3"><span class="w-8 h-8 shrink-0 rounded-xl grid place-items-center font-black text-white" style="background:${c.color}">${i+1}</span><h3 class="font-bold leading-relaxed">${esc(q)}</h3></div><button onclick="toggleAnswer('ans-${c.slug}-${i}',this)" class="quiz-btn mt-4 text-sm font-bold soft rounded-xl px-3 py-2">👁 Mostrar respuesta</button><div id="ans-${c.slug}-${i}" class="answer mt-4 pt-4 border-t border-white/10 text-slate-300 leading-relaxed">${esc(a)}</div></article>`).join('')}</div></section><section id="requisitos" class="glass rounded-[28px] p-6 md:p-8 mb-7"><div class="section-title mb-5"><span class="ico">📄</span><span>${requisitosCustom?'¿Qué necesito para cursar?':'Requisitos de ingreso'}</span></div>${requisitosCustom?'':`<p class="text-slate-400 mb-5">La documentación puede actualizarse; ante un caso particular conviene validar la condición vigente.</p>`}${list(requisitos)}</section><div class="grid sm:grid-cols-2 gap-3 pb-12">${c.url?`<a href="${c.url}" target="_blank" rel="noopener" class="text-center rounded-2xl px-5 py-4 font-black text-white" style="background:${c.color}">🌐 Ver landing oficial</a>`:`<div class="soft rounded-2xl px-5 py-4 text-center text-slate-400">Landing oficial aún no cargada</div>`}<button onclick="copyInfo('${c.slug}')" class="soft rounded-2xl px-5 py-4 font-black hover:bg-white/10">📋 Copiar resumen comercial</button></div></main>`;}
function copyDiscovery(slug){const c=carreras.find(x=>x.slug===slug),d=DISCOVERY[slug];if(!d)return;const txt=`🔎 Guía de indagación · ${c.nombre}\n\n🎯 Objetivo:\n${d.objetivo}\n\n💬 Preguntas sugeridas:\n${d.preguntas.map((q,i)=>`${i+1}. ${q}`).join('\n')}\n\n👂 Qué escuchar:\n• ${d.escuchar.join('\n• ')}`;navigator.clipboard.writeText(txt).then(()=>showToast('Preguntas copiadas ✅'));}function goSection(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}function toggleAnswer(id,btn){const box=document.getElementById(id),show=!box.classList.contains('show');box.classList.toggle('show',show);btn.textContent=show?'🙈 Ocultar respuesta':'👁 Mostrar respuesta'}
function randomQuestion(slug){const c=carreras.find(x=>x.slug===slug),qs=quizFor(c),[q,a]=qs[Math.floor(Math.random()*qs.length)],box=document.getElementById('randomBox');box.classList.remove('hidden');box.innerHTML=`<div class="eyebrow mb-2">Pregunta aleatoria</div><div class="text-xl font-black">${esc(q)}</div><button onclick="this.nextElementSibling.classList.toggle('hidden')" class="mt-4 soft rounded-xl px-3 py-2 text-sm font-bold">Ver / ocultar respuesta</button><div class="hidden mt-4 pt-4 border-t border-white/10 text-slate-300">${esc(a)}</div>`;box.scrollIntoView({behavior:'smooth',block:'center'});}
function copyInfo(slug){const c=carreras.find(x=>x.slug===slug),cert=c.certificaciones.length?`\n📜 ${c.certificaciones.join(' · ')}`:'',x=COMERCIAL[c.slug];const detalle=c.donde&&c.donde.length?`\n\n💼 Ámbitos:\n• ${c.donde.slice(0,4).join('\n• ')}`:`\n\n🧠 Podrás:\n• ${c.hacer.slice(0,4).join('\n• ')}`;const txt=`🎓 ${c.nombre}\n${c.titulo}\n⏳ ${c.duracion}\n💻 ${c.modalidad}${cert}\n\n🎯 ${x?.pitch||c.presentacion}${detalle}\n\n📅 Próximos inicios informados: Marzo - Abril 2027`;navigator.clipboard.writeText(txt).then(()=>showToast('✅ Resumen copiado'));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function render(){const slug=decodeURIComponent(location.hash.replace('#',''));const c=carreras.find(x=>x.slug===slug);document.getElementById('app').innerHTML=c?career(c):home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
