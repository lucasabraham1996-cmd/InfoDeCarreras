        const Badge = ({ children, color }) => (
            <span 
                className="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider text-white shadow-sm"
                style={{ backgroundColor: color || '#666' }}
            >
                {children}
            </span>
        );

        const CareerModule = ({ career, onBack }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [generatedMessage, setGeneratedMessage] = useState("");

            const handleOpenModal = () => {
                const diferencialesObj = career.mas_info.find(i => i.titulo.includes("Diferenciales"));
                const diferencialesText = diferencialesObj 
                    ? diferencialesObj.contenido.replace(/•/g, "✅").replace(/\*\*/g, "") 
                    : "✅ Formación práctica y de calidad.";

                const message = `
Hola! 👋 Te paso la info de *${career.nombre}* en Cervantes:

🎓 *Título Oficial:* ${career.titulo_final}
${career.titulo_intermedio ? `📜 *Certificaciones:* \n${career.titulo_intermedio.replace(/•/g, "🔸")}` : ''}
${career.extra_info_titulo ? `🚀 *Plus:* ${career.extra_info_titulo}` : ''}
⏳ *Duración:* ${career.duracion}
📍 *Modalidad:* ${career.modalidad}

🌟 *¿Por qué elegir esta carrera?*
${diferencialesText}

¿Te gustaría que veamos el plan de estudios o tenés alguna duda puntual? 🤓
                `.trim();

                setGeneratedMessage(message);
                setIsModalOpen(true);
            };

            return (
                <div className="container mx-auto px-4 md:px-8 py-12 animate-in fade-in slide-in-from-top-10 duration-500">
                    <MessageModal 
                        isOpen={isModalOpen} 
                        onClose={() => setIsModalOpen(false)} 
                        message={generatedMessage}
                        careerColor={career.color}
                    />

                    <button 
                        onClick={onBack} 
                        className="flex items-center gap-2 text-blue-300 hover:text-blue-100 transition-colors mb-8 text-lg font-medium"
                    >
                        <ArrowLeft size={20} /> Volver a Carreras
                    </button>

                    {/* Hero de la Carrera */}
                    <div 
                        className="relative p-8 md:p-12 rounded-3xl overflow-hidden mb-12 shadow-2xl animate-in fade-in zoom-in duration-500"
                        style={{ background: `linear-gradient(135deg, ${career.color}44 0%, transparent 100%)`, border: '1px solid rgba(255,255,255,0.2)' }}
                    >
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                            <Badge color={career.color + '99'}>{career.area}</Badge>
                            {career.extra_info_titulo && (
                                <span className="bg-white/10 text-yellow-300 px-3 py-1 rounded-full text-xs font-bold border border-yellow-300/30 animate-pulse flex items-center gap-2">
                                    <Star size={14} fill="currentColor" /> {career.extra_info_titulo}
                                </span>
                            )}
                        </div>
                        
                        <h1 className="text-4xl md:text-5xl font-extrabold text-white mt-2 mb-3 leading-tight drop-shadow-md">
                            {career.nombre}
                        </h1>
                        <p className="text-lg md:text-xl text-blue-100/90 max-w-3xl font-light leading-relaxed">
                            {career.descripcion}
                        </p>

                        {/* Títulos Intermedios Destacados en el Hero */}
                        {career.titulo_intermedio && (
                            <div className="mt-6 p-4 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm">
                                <h3 className="text-sm uppercase tracking-wider text-white/50 font-bold mb-2 flex items-center gap-2">
                                    <Award size={16} /> Títulos Intermedios & Certificaciones
                                </h3>
                                <p className="text-white/90 whitespace-pre-line font-medium leading-relaxed">
                                    {career.titulo_intermedio}
                                </p>
                            </div>
                        )}

                        {/* Stats */}
                        <div className="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
                            <div className="bg-white/10 p-4 rounded-xl flex flex-col items-center justify-center border border-white/10">
                                <Clock className="text-blue-300 mb-2" size={28} />
                                <span className="text-2xl font-bold">{career.duracion}</span>
                                <span className="text-xs text-gray-300 uppercase mt-1">Duración</span>
                            </div>
                            <div className="bg-white/10 p-4 rounded-xl flex flex-col items-center justify-center border border-white/10">
                                <Users className="text-purple-300 mb-2" size={28} />
                                <span className="text-lg font-bold text-center leading-tight py-1">{career.modalidad}</span>
                                <span className="text-xs text-gray-300 uppercase mt-1">Modalidad</span>
                            </div>
                        </div>
                    </div>

                    {/* Contenido Principal de la Carrera - UNA SOLA COLUMNA */}
                    <div className="flex flex-col gap-8 mb-12">
                        {/* Perfil del Egresado (Usando InfoCard para el efecto hover) */}
                        <InfoCard 
                            careerColor={career.color}
                            item={{
                                titulo: "Perfil del Egresado",
                                contenido: career.perfil
                            }}
                        />

                        {/* Contenidos Claves */}
                        <div className="bg-black/20 border border-white/10 rounded-2xl p-6 shadow-lg overflow-hidden group hover:border-white/30 transition-all duration-300 hover:-translate-y-1"
                             style={{ boxShadow: `0 10px 30px -10px ${career.color}22` }}>
                            <h3 className="text-2xl font-bold mb-4 flex items-center gap-2 text-cyan-300">
                                <BookOpen size={24} /> Contenidos Claves
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {career.materias_clave.map((m, i) => (
                                    <div key={i} className="flex items-center gap-3 text-white/80 text-lg">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: career.color }}></div>
                                        {m}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Sección de Más Información / Otros Detalles */}
                        <div className="flex flex-col gap-6">
                            {career.mas_info && career.mas_info.map((item, index) => (
                                <InfoCard key={index} item={item} careerColor={career.color} />
                            ))}
                        </div>

                        {/* Botón de Armar Mensaje */}
                        <button 
                            onClick={handleOpenModal}
                            className="w-full py-4 rounded-xl font-bold text-white shadow-lg transition-all hover:scale-[1.02] hover:shadow-green-500/20 mt-4 flex items-center justify-center gap-3"
                            style={{ backgroundColor: '#25D366' }}
                        >
                            <MessageCircle size={24} />
                            Armar mensaje para WhatsApp
                        </button>
                    </div>

                </div>
            );
        };

        const App = () => {
            const [activeCareerSlug, setActiveCareerSlug] = useState(null);

            const navigateToCareer = (slug) => {
                setActiveCareerSlug(slug);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const goBack = () => {
                setActiveCareerSlug(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const selectedCareer = CARRERAS.find(c => c.slug === activeCareerSlug);

            return (
                <div className="min-h-screen font-sans text-slate-100 selection:bg-blue-500 selection:text-white overflow-x-hidden relative">
                    {/* FONDO FIJO */}
                    <div 
                        className="fixed inset-0 z-0"
                        style={{
                            backgroundImage: 'url("https://i.postimg.cc/6wfDzyN9/image.png")',
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            backgroundAttachment: 'fixed',
                        }}
                    >
                        <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]"></div>
                    </div>

                    {/* CONTENIDO SCROLLABLE */}
                    <div className="relative z-10 pb-20">
                        
                        {!selectedCareer ? (
                            <React.Fragment>
                                {/* HEADER */}
                                <header className="pt-20 pb-12 px-4 text-center">
                                    <div className="inline-block p-4 rounded-full bg-white/5 border border-white/10 backdrop-blur-xl mb-6 shadow-[0_0_30px_rgba(255,255,255,0.1)]">
                                        <img src="https://i.ibb.co/4nqvFQGM/logo.png" alt="Logo Cervantes" className="h-16 w-auto object-contain" />
                                    </div>
                                    <h1 className="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-200 via-white to-blue-200 drop-shadow-md tracking-tight mb-4">
                                        Cervantes
                                    </h1>
                                    <p className="text-xl md:text-2xl text-blue-100/80 max-w-2xl mx-auto font-light leading-relaxed">
                                        Formando profesionales con pasión y excelencia.
                                        <br/>
                                        <span className="text-sm font-medium uppercase tracking-[0.2em] opacity-70 mt-2 block">Oferta Académica 2025</span>
                                    </p>
                                </header>

                                {/* GRID */}
                                <main className="container mx-auto px-4 md:px-8">
                                    <SectionTitle>Nuestras Carreras</SectionTitle>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-24">
                                        {CARRERAS.map((carrera) => (
                                            <GlassCard 
                                                key={carrera.id} 
                                                hoverColor={carrera.color}
                                                onClick={() => navigateToCareer(carrera.slug)}
                                                className="min-h-[280px] flex flex-col justify-between group"
                                            >
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <Badge color={carrera.color + '99'}>{carrera.area}</Badge>
                                                        <ChevronRight className="opacity-0 group-hover:opacity-100 transform translate-x-[-10px] group-hover:translate-x-0 transition-all" />
                                                    </div>
                                                    <h3 className="text-2xl font-bold mb-3 leading-tight">{carrera.nombre}</h3>
                                                    <p className="text-sm opacity-80 mb-4 font-light leading-relaxed">
                                                        {carrera.descripcion}
                                                    </p>
                                                </div>
                                                
                                                <div className="flex flex-col gap-2 text-sm font-medium opacity-90 pt-4 border-t border-white/20 mt-auto">
                                                    <div className="flex items-center gap-1">
                                                        <Clock size={16} /> {carrera.duracion}
                                                    </div>
                                                    <div className="flex items-center gap-1">
                                                        <Users size={16} /> <span className="text-xs">{carrera.modalidad}</span>
                                                    </div>
                                                </div>
                                            </GlassCard>
                                        ))}
                                    </div>

                                    {/* CUADRO COMPARATIVO (SÓLO TABLA, SIN GRÁFICO) */}
                                    <div className="max-w-4xl mx-auto mb-20">
                                        <div className="bg-black/20 border border-white/10 rounded-3xl p-8 backdrop-blur-xl shadow-2xl overflow-hidden">
                                            <h3 className="text-2xl font-bold mb-6 flex items-center gap-2">
                                                <BarChart3 className="text-purple-400" /> Resumen Comparativo
                                            </h3>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-white/20 text-white/60 text-sm uppercase tracking-wider">
                                                            <th className="pb-3 font-medium">Carrera</th>
                                                            <th className="pb-3 font-medium text-center">Duración</th>
                                                            <th className="pb-3 font-medium text-center">Modalidad</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm font-light">
                                                        {CARRERAS.map((c, i) => (
                                                            <tr key={i} className="group hover:bg-white/5 transition-colors">
                                                                <td className="py-4 font-medium text-white group-hover:text-blue-300 transition-colors">
                                                                    {c.nombre}
                                                                </td>
                                                                <td className="py-4 text-center opacity-80 text-xs">
                                                                    {c.duracion}
                                                                </td>
                                                                <td className="py-4 text-center opacity-80 text-xs">
                                                                    {c.modalidad}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>

                                    {/* FOOTER EXTRA */}
                                    <div className="rounded-3xl p-8 md:p-12 bg-gradient-to-br from-blue-900/40 to-slate-900/40 border border-white/10 backdrop-blur-md text-center mb-20">
                                        <Award size={48} className="mx-auto text-yellow-400 mb-6" />
                                        <h3 className="text-3xl font-bold mb-4">¿Por qué elegir Cervantes?</h3>
                                        <p className="max-w-3xl mx-auto text-lg text-blue-100/80 mb-8">
                                            Más de 60 años de trayectoria formando profesionales. Contamos con convenios universitarios para que puedas continuar tu licenciatura y una bolsa de trabajo activa.
                                        </p>
                                        <button className="px-8 py-3 bg-white text-slate-900 font-bold rounded-full hover:bg-blue-50 transition-transform hover:scale-105 shadow-lg shadow-white/20">
                                            Solicitar Más Información
                                        </button>
                                    </div>
                                </main>
                            </React.Fragment>
                        ) : (
                            <CareerModule career={selectedCareer} onBack={goBack} />
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
